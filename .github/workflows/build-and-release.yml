name: Build and Release

on:
  push:
    branches: ["main"]
    paths:
      - "**.ps1"
      - "VERSION"
      - ".github/workflows/build-and-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Executable and Create Release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate PowerShell 7 syntax and regression checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $PWD.Path 'MEGA.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                  Write-Host "::error file=MEGA.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
              throw 'MEGA.ps1 contains syntax errors.'
          }
          & (Join-Path $PWD.Path 'tests\Test-MEGA.ps1')

      - name: Validate Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path (Get-Location).Path 'MEGA.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                  Write-Host "::error file=MEGA.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
              throw 'MEGA.ps1 contains syntax errors.'
          }
          & (Join-Path (Get-Location).Path 'tests\Test-MEGA.ps1')

      - name: Resolve and increment version
        id: resolve_version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionFile = "VERSION"
          if (-not (Test-Path -Path $versionFile)) {
              Set-Content -Path $versionFile -Value "0.1" -NoNewline
          }

          $rawVersionStr = (Get-Content -Path $versionFile -Raw).Trim().TrimStart('v', 'V')
          if ($rawVersionStr -notmatch '^\d+(\.\d+)+$') {
              Write-Warning "Invalid VERSION value '$rawVersionStr'; falling back to 0.1."
              $rawVersionStr = "0.1"
          }
          $fileVersion = [version]$rawVersionStr
          $fileMinorVersion = [version]::new($fileVersion.Major, $fileVersion.Minor)

          # Synchronize tags from remote so version resolution sees every release.
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) {
              throw "git fetch --tags failed with exit code $LASTEXITCODE."
          }

          $parsedVersions = foreach ($tag in @(git tag -l "v*")) {
              $cleanTag = $tag.TrimStart('v', 'V')
              if ($cleanTag -match '^\d+(\.\d+)+$') {
                  [version]$cleanTag
              }
          }

          $latestTagVersion = if ($parsedVersions) {
              @($parsedVersions | Sort-Object -Descending)[0]
          } else {
              $null
          }

          # Release tags are Major.Minor. A VERSION file with a patch component is
          # normalized to Major.Minor, then compared against the latest tag.
          if ($null -eq $latestTagVersion -or $fileMinorVersion -gt $latestTagVersion) {
              $targetVersion = "$($fileMinorVersion.Major).$($fileMinorVersion.Minor)"
          } else {
              $targetVersion = "$($latestTagVersion.Major).$($latestTagVersion.Minor + 1)"
          }

          $releaseTag = "v$targetVersion"
          # git tag --list exits 0 even when there is no match, avoiding a
          # stale non-zero $LASTEXITCODE at the end of this step.
          if (git tag --list "$releaseTag") {
              throw "Release tag $releaseTag already exists."
          }

          $peParts = @($targetVersion.Split('.'))
          while ($peParts.Count -lt 4) {
              $peParts += '0'
          }
          $peVersion = ($peParts[0..3] -join '.')

          Write-Host "Target Version : $targetVersion"
          Write-Host "Target Git Tag : $releaseTag"
          Write-Host "PE Version     : $peVersion"

          "VERSION=$targetVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PE_VERSION=$peVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install PS2EXE Module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name ps2exe -Scope CurrentUser -Repository PSGallery -Force -SkipPublisherCheck

      - name: Compile MEGA.ps1 to MEGA.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Packaging MEGA.ps1 with icon and metadata (PE Version: $env:PE_VERSION)..."

          Invoke-PS2EXE `
              -InputFile "MEGA.ps1" `
              -OutputFile "MEGA.exe" `
              -IconFile "edgerome.ico" `
              -Title "Make Edge Google Again" `
              -Description "Make Edge Google Again (MEGA) - Microsoft Edge Auto-Deploy & Configuration Tool" `
              -Company "Traxton" `
              -Product "MEGA" `
              -Copyright "MIT License" `
              -Version $env:PE_VERSION `
              -NoConsole:$false `
              -UNICODEEncoding:$true

          if (-not (Test-Path -Path "MEGA.exe")) {
              throw "Build Error: Compiled executable MEGA.exe was not created."
          }

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hashLines = foreach ($file in @("MEGA.exe")) {
              if (Test-Path -Path $file) {
                  $fileHash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
                  "$fileHash  $file"
              }
          }
          $hashLines | Set-Content -Path "checksums.txt" -Encoding utf8
          Write-Host "Generated SHA256 Checksums:"
          Get-Content -Path "checksums.txt"

      - name: Create Git Tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $exeHash = if (Test-Path -Path "MEGA.exe") {
              (Get-FileHash -Path "MEGA.exe" -Algorithm SHA256).Hash.ToLower()
          } else {
              "N/A"
          }

          $releaseNotes = @(
              "## Make Edge Google Again (MEGA) $env:TAG",
              "",
              "Automated release generated via GitHub Actions.",
              "",
              "### Quick Start",
              "**Option 1: One-Line PowerShell Execution**",
              '```powershell',
              'irm https://raw.githubusercontent.com/notxart/MEGA/main/MEGA.ps1 | iex',
              '```',
              "",
              "**Option 2: Standalone Executable**",
              "Download and execute ``MEGA.exe`` directly on Windows 10/11.",
              "",
              "No administrator privileges are required for normal use. MEGA requests UAC automatically when the HKCU Edge policy key is not writable and the current account is a local administrator.",
              "",
              "### SHA-256 Checksum",
              "- ``MEGA.exe``: ``$exeHash``"
          ) -join "`n"

          $releaseNotes | Set-Content -Path "release_notes.md" -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$env:TAG" -m "Release $env:TAG"
          if ($LASTEXITCODE -ne 0) {
              throw "git tag failed with exit code $LASTEXITCODE."
          }

          git push origin "$env:TAG"
          if ($LASTEXITCODE -ne 0) {
              throw "git push failed with exit code $LASTEXITCODE."
          }

          gh release create "$env:TAG" MEGA.exe checksums.txt `
              --title "MEGA $env:TAG" `
              --notes-file "release_notes.md" `
              --generate-notes
          if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE."
          }
